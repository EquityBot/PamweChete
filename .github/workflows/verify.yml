name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Test skill regressions
        run: python -m unittest tests.test_skill_regressions
      - name: Test extension boundaries
        run: node --experimental-vm-modules --test tests/extension-boundaries.test.mjs
      - name: Verify Featherless Qwen profile
        run: node scripts/verify-featherless-qwen-profile.mjs profiles/featherless-qwen38
      - name: Test the profile verifier
        run: node --test tests/verify-featherless-qwen-profile.test.mjs
      - name: Install bash-guard dependencies
        working-directory: extensions/bash-guard
        run: npm ci --ignore-scripts
      - name: Test bash guard
        working-directory: extensions/bash-guard
        run: npm test
      - name: Test Featherless tool bridge
        working-directory: extensions/featherless-tool-bridge
        run: npm test
      - name: Test RTK output compression
        working-directory: extensions/rtk
        run: npm test
